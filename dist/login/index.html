<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>الدخول | Amigo</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/firebase-auth.js"></script>
  <style>
    body.login-page{background:#f7f8ff;color:#132d62}
    .login-header{position:absolute;z-index:5;top:0;right:0;left:0;background:transparent;border:0}
    .login-header .nav{height:86px}.login-header .logo{color:#fff}
    .login-page main{min-height:100vh}
    .login-collage{min-height:100vh;display:grid;grid-template-columns:1.07fr .93fr;position:relative;overflow:hidden;background:#154ad1}
    .collage-photos{display:grid;grid-template-columns:1.15fr .85fr;min-height:100vh;gap:8px;padding:8px;direction:ltr}
    .photo{position:relative;overflow:hidden;border-radius:18px;background:#254a8d}
    .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,39,95,.02) 35%,rgba(10,31,82,.44))}
    .photo img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .7s ease}
    .photo:hover img{transform:scale(1.04)}
    .photo-main{min-height:calc(100vh - 16px)}
    .photo-main img{object-position:54% center}
    .photo-side{display:grid;grid-template-rows:1fr .78fr;gap:8px}
    .photo-side img{object-position:center}
    .photo-caption{position:absolute;z-index:2;bottom:34px;right:34px;left:26px;color:#fff}
    .photo-caption strong{display:block;font-size:clamp(25px,3vw,45px);line-height:1.22;font-weight:900;max-width:480px}
    .photo-caption span{display:block;margin-top:10px;color:#e4edff;font-weight:700;font-size:14px}
    .login-panel{display:flex;align-items:center;justify-content:center;position:relative;padding:110px 42px 46px;background:linear-gradient(135deg,#fdf9f6 0%,#f2f6ff 100%)}
    .login-panel::before,.login-panel::after{content:"";position:absolute;border-radius:50%;filter:blur(.2px);pointer-events:none}
    .login-panel::before{width:270px;height:270px;background:#d9e6ff;top:-95px;left:-110px}
    .login-panel::after{width:240px;height:240px;background:#ffe0cb;bottom:-105px;right:-90px}
    .login-box{position:relative;z-index:1;width:min(100%,450px);padding:42px;background:rgba(255,255,255,.91);border:1px solid rgba(255,255,255,.95);border-radius:26px;box-shadow:0 24px 65px rgba(25,62,133,.16);backdrop-filter:blur(12px)}
    .login-box .eyebrow{margin-bottom:14px;color:#2867f8;letter-spacing:0}
    .login-box h1{margin:0 0 12px;font-size:clamp(34px,4vw,48px);line-height:1.25;font-weight:900;color:#12316e}
    .login-box>p{margin:0 0 27px;color:#687a99;font-size:16px;line-height:1.9}
    .google-button{height:58px;gap:12px!important;background:#2867f8!important;box-shadow:0 10px 24px rgba(40,103,248,.26)}
    .google-icon{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#fff;color:#4285f4;font:900 17px/1 Arial}
    .login-box .form-message{margin:15px 0 0;text-align:center}
    .login-note{display:flex;align-items:center;gap:9px;margin-top:28px;color:#71809b;font-size:12px;font-weight:700}
    .login-note i{width:8px;height:8px;border-radius:50%;background:#ff8b56;display:block;flex:none}
    .floating-tag{position:absolute;z-index:2;left:-37px;top:25%;background:#fff;color:#153a82;border-radius:14px;padding:12px 17px;box-shadow:0 14px 28px rgba(29,66,140,.17);font-size:13px;font-weight:800;transform:rotate(-4deg)}
    .floating-tag span{color:#ff715f;font-size:19px;margin-left:6px}
    @media(max-width:850px){
      .login-header .logo{color:#12316e}.login-collage{display:block;background:#f8fbff}.collage-photos{min-height:300px;height:40vh;padding:7px}.photo-main{min-height:0}.photo-caption{bottom:22px;right:22px}.photo-caption strong{font-size:29px}.photo-side{grid-template-rows:1fr 1fr}.login-panel{padding:48px 20px 42px;min-height:auto}.login-box{padding:32px 25px}.floating-tag{display:none}
    }
    @media(max-width:480px){.login-header .nav{height:70px}.login-box h1{font-size:34px}.collage-photos{height:270px}.photo-caption span{display:none}.photo-caption strong{font-size:24px}}
  </style>
</head>
<body class="login-page">
  <header class="header login-header">
    <div class="nav wrap">
      <a href="/" class="logo"><span class="logo-mark">a<span>.</span></span> amigo<span class="logo-dot">.</span></a>
    </div>
  </header>
  <main>
    <section class="login-collage" aria-label="الدخول إلى Amigo">
      <div class="collage-photos" aria-hidden="true">
        <div class="photo photo-main">
          <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=1200&q=85" alt="">
          <div class="photo-caption">
            <strong>تعليمك… على مقاس طموحك.</strong>
            <span>كورسات مختارة، وخطوات واضحة نحو هدفك.</span>
          </div>
        </div>
        <div class="photo-side">
          <div class="photo"><img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=800&q=85" alt=""></div>
          <div class="photo"><img src="https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=800&q=85" alt=""></div>
        </div>
      </div>
      <div class="login-panel">
        <div class="floating-tag"><span>✦</span> خطوتك الجاية تبدأ هنا</div>
        <div class="login-box">
          <div class="eyebrow">دخول آمن وسريع</div>
          <h1>أهلًا بيك.</h1>
          <p>سجّل بحساب Google الخاص بك، وكمّل رحلتك التعليمية من حيث توقفت.</p>
          <div>
            <button id="google-login-button" class="btn btn-dark full google-button" type="button"><span class="google-icon">G</span>المتابعة باستخدام Google</button>
            <p class="form-message" role="status" aria-live="polite"></p>
          </div>
          <div class="login-note"><i></i>لا نطلب كلمة مرور أو رابطًا على البريد.</div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
