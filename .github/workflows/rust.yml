name: Rust checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build --release
      - run: cargo run --release -- --export dist
      - uses: actions/upload-artifact@v4
        with:
          name: amigo-static-pages
          path: dist/
